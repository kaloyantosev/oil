name: Refresh news and market data

# Hourly. Each commit redeploys the site, so this stays well under Vercel's daily deploy limit.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_static.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # optional: AI briefs and commentary
      - name: Commit if changed
        run: |
          if git diff --quiet public/static/data; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/static/data
          git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
